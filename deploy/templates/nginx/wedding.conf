# Nginx configuration for Wedding Invitation Web Application
# Production-ready template with security headers, PHP-FPM, and SSL support
#
# Placeholders (to be replaced by installer):
# {{DOMAIN}} - Your domain name
# {{DOCUMENT_ROOT}} - Document root path
# {{PHP_SOCKET}} - PHP-FPM socket path
# {{LOG_PATH}} - Log directory path
# {{UPLOAD_LIMIT}} - Upload size limit

server {
    listen 80;
    server_name {{DOMAIN}};

    root {{DOCUMENT_ROOT}};
    index index.php admin.php save.php messages.php gallery.php;

    access_log {{LOG_PATH}}/wedding.access.log;
    error_log {{LOG_PATH}}/wedding.error.log;

    client_max_body_size {{UPLOAD_LIMIT}};
    autoindex off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block sensitive paths
    location ~ ^/(app|deploy|backups|\.git) {
        deny all;
        return 403;
    }

    # Block sensitive file types (JSON, SQLite, ENV)
    location ~ \.(json|sqlite|env)$ {
        deny all;
        return 403;
    }

    # Block hidden files (dotfiles)
    location ~ /\. {
        deny all;
        return 403;
    }

    # Disable PHP execution in uploads directory
    location /uploads {
        location ~ \.php$ {
            deny all;
            return 403;
        }
    }

    # Main routing: serve static files, fallback to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM handler
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:{{PHP_SOCKET}};
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Additional FastCGI parameters
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
        fastcgi_read_timeout 60s;
    }

    # Cache static assets (images, CSS, JS, fonts)
    location ~* \.(jpg|jpeg|png|gif|webp|css|js|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to backup files
    location ~ \.(bak|backup|old|orig|save)$ {
        deny all;
        return 403;
    }
}

