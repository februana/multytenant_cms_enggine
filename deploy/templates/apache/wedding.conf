# Notes:
# 1. To enable WebDAV, create password file: htpasswd -c /etc/apache2/.davpasswd username
# 2. WebDAV requires these Apache modules: dav, dav_fs, auth_basic, headers, rewrite, proxy_fcgi, setenvif, alias, socache_shmcb
# 3. For production, replace {{DOMAIN}} with your actual domain name
# 4. HTTPS VirtualHost is commented out by default - enable after obtaining SSL certificate
