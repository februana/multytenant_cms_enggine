server {
    listen 80;
    server_name februandik.duckdns.org;

    root /var/www/februandik-web;
    index index.php admin.php save.php messages.php gallery.php;

    access_log /var/log/nginx/februandik.access.log;
    error_log /var/log/nginx/februandik.error.log;

    client_max_body_size 20M;

    # Disable directory listing
    autoindex off;

    # Block access to sensitive directories and files
    location ~ ^/(app|deploy|backups) {
        deny all;
        return 403;
    }

    location ~ \.(json|sqlite)$ {
        deny all;
        return 403;
    }

    location ~ /\. {
        deny all;
        return 403;
    }

    # Disable PHP execution in uploads
    location /uploads {
        location ~ \.php$ {
            deny all;
            return 403;
        }
    }

    # Main routing: serve static files, fallback to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM handler
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|webp|css|js|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
    }
}
