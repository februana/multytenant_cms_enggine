<VirtualHost *:${APACHE_PORT}>
    ServerName _
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "^(\.env|config\.json|database\.sqlite|guest-links\.json)$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "^/var/www/html/(backups|webdav)(/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
