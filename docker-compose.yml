services:
  wedding-cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding_cms_server
    restart: always
    ports:
      - "80:80"
    environment:
      - ADMIN_USER=admin
      - ADMIN_PASS=securepassword123
      - UNDANGAN_DB_PATH=/var/data/database.sqlite
    volumes:
      - wedding_data:/var/data
      - wedding_uploads:/var/www/wedding/uploads

volumes:
  wedding_data:
  wedding_uploads:
