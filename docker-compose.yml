services:
  wedding-cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding_cms_server
    restart: always
    ports:
      - "80:80"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:?Set ADMIN_PASS in .env before starting Compose}
      RUNTIME_PHP_MODE: apache
      UNDANGAN_DATA_DIR: /var/data
      UNDANGAN_DB_PATH: /var/data/database.sqlite
    volumes:
      - wedding_data:/var/data
      - wedding_uploads:/var/www/wedding/uploads
      - wedding_backups:/var/www/wedding/backups
      - wedding_webdav:/var/www/wedding/webdav
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  wedding_data:
  wedding_uploads:
  wedding_backups:
  wedding_webdav:
