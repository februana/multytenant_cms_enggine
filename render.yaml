services:
  - type: web
    name: webserver-undangan
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: UNDANGAN_DATA_DIR
        value: /var/data
      - key: UNDANGAN_DB_PATH
        value: /var/data/database.sqlite
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
